# Pubblica le 4 Edge Function su Supabase, senza installare nulla sul telefono.
# Servono 2 Secrets nel repo: SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF.
name: Deploy Edge Functions
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          for f in dama-move forza4-move tris-move scacchi-lichess; do
            supabase functions deploy "$f" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" 2>&1 | tee -a deploy_logs.txt
          done
      - name: Riepilogo
        if: always()
        run: tail -60 deploy_logs.txt >> "$GITHUB_STEP_SUMMARY"
