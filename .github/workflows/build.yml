name: Build APK

on: {workflow_dispatch: {}, push: {branches: [main]}}

permissions: {contents: read}

jobs:

  build:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
      
        with: {distribution: temurin, java-version: '17'}
        
      - run: |
      
          unzip -q DuelApp-CI-source.zip -d ci_source
          
          test -f ci_source/lib/main.dart
          
          test -f ci_source/assets/audio/move.wav
          
          ! grep -q '^dependency_overrides:' ci_source/pubspec.yaml
          
      - run: |
      
          npm i -g typescript
          
          cd ci_source && bash tests/node_tests.sh
          
      - uses: subosito/flutter-action@v2
      
        with: {channel: stable, flutter-version: 3.35.x}
        
      - run: |
      
          java -version
          
          flutter create --org app.duel --project-name duelapp --platforms android build_app
          
          rm -rf build_app/lib build_app/assets build_app/test
          
          cp -r ci_source/lib ci_source/assets build_app/
          
          cp ci_source/pubspec.yaml ci_source/analysis_options.yaml build_app/
          
          python3 -c "p='build_app/android/app/src/main/AndroidManifest.xml';s=open(p).read();s=s.replace('<application','<uses-permission android:name=\"android.permission.INTERNET\"/>\\n<queries><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"https\"/></intent></queries>\\n<application',1);open(p,'w').write(s)"
          
      - working-directory: build_app
      
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
        
      - env:
      
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
        
      - name: Validate Supabase API key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          url="${SUPABASE_URL%/}"
          auth_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" "$url/auth/v1/settings")
          if [ "$auth_code" != "200" ]; then
            echo "::error::Supabase Auth rejected the configured API key (HTTP $auth_code)"
            exit 1
          fi
          rest_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$url/rest/v1/games?select=id&limit=1")
          if [ "$rest_code" != "200" ]; then
            echo "::error::Supabase REST rejected the configured project/key (HTTP $rest_code)"
            exit 1
          fi
          echo "Supabase Auth and REST accepted the configured public key."
        
      - working-directory: build_app
      
        env:
        
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        
      - run: |
      
          unzip -p build_app/build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so >/tmp/libapp.so
          
          test -s /tmp/libapp.so && file /tmp/libapp.so
          
          strings -n 8 /tmp/libapp.so | grep -qiE 'product .* arm64 android'
          
          ! strings -n 8 /tmp/libapp.so | grep -qiE 'arm64 linux no-compressed-pointers'
          
      - uses: actions/upload-artifact@v4
      
        with: {name: duelapp-scala40-arm64, path: build_app/build/app/outputs/flutter-apk/app-release.apk, if-no-files-found: error}
        








































